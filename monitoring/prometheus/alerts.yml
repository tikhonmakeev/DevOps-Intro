groups:
  - name: quicknotes
    rules:
      - alert: HighErrorRate
        expr: sum(rate(quicknotes_http_responses_by_code_total{job="quicknotes",code=~"4..|5.."}[5m])) / sum(rate(quicknotes_http_requests_total{job="quicknotes"}[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: QuickNotes error ratio above 5%
          runbook: https://github.com/tikhonmakeev/DevOps-Intro/blob/feature/lab8/docs/runbook/high-error-rate.md
