- name: deploy quicknotes
  hosts: quicknotes
  become: true
  gather_facts: false
  vars:
    listen_addr: ':8080'
    data_dir: /var/lib/quicknotes
    data_path: /var/lib/quicknotes/notes.json
    seed_path: /var/lib/quicknotes/seed.json
  tasks:
    - name: service group
      ansible.builtin.group:
        name: quicknotes
        system: true
    - name: service user
      ansible.builtin.user:
        name: quicknotes
        group: quicknotes
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: data directory
      ansible.builtin.file:
        path: '{{ data_dir }}'
        state: directory
        owner: quicknotes
        group: quicknotes
        mode: '0750'
    - name: binary
      ansible.builtin.copy:
        src: quicknotes
        dest: /usr/local/bin/quicknotes
        owner: root
        group: root
        mode: '0755'
      notify: restart quicknotes
    - name: seed
      ansible.builtin.copy:
        src: seed.json
        dest: '{{ seed_path }}'
        owner: quicknotes
        group: quicknotes
        mode: '0640'
    - name: unit
      ansible.builtin.template:
        src: quicknotes.service.j2
        dest: /etc/systemd/system/quicknotes.service
        owner: root
        group: root
        mode: '0644'
      notify: restart quicknotes
    - name: apply unit before starting
      ansible.builtin.meta: flush_handlers
    - name: enable and start
      ansible.builtin.systemd_service:
        name: quicknotes
        enabled: true
        state: started
  handlers:
    - name: restart quicknotes
      ansible.builtin.systemd_service:
        name: quicknotes
        daemon_reload: true
        state: restarted
